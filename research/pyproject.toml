[project]
name = "sundown-research"
version = "0.0.0"
description = "Offline analysis and calendar differential-test fixtures for Sundown (not production)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
