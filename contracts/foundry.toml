[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# cancun opcodes (PUSH0/TLOAD/MCOPY) verified by eth_call on Arbitrum One/Sepolia and Robinhood mainnet/testnet (docs/DISCOVERY.md)
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# exhaustive differential tests iterate tens of thousands of fixture rows
gas_limit = 9223372036854775807
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64 }
verbosity = 2

[profile.fork]
# fork tests are opt-in: `forge test --profile fork` with RPC URLs from .env
fuzz = { runs = 64 }

[rpc_endpoints]
arbitrum_one = "${ARBITRUM_ONE_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
