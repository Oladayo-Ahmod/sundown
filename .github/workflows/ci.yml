name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test
        env:
          FOUNDRY_PROFILE: ci
      - name: Gas snapshot
        run: forge snapshot --check
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Slither
        run: |
          pip install slither-analyzer==0.11.6
          slither . --config-file slither.config.json

  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
