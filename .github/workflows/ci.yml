name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned, not "stable": every recorded result (231 passed, 0 failed, 4 skipped; the gas snapshot; the gas
      # targets) was produced with Foundry v1.4.4. "stable" moved to v1.8.4, which reports each invariant suite as
      # one campaign (219 tests instead of 235) and measures the oracle read at 63,897 gas against the 60,000 target.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test
        env:
          FOUNDRY_PROFILE: ci
      - name: Gas snapshot
        run: forge snapshot --check --no-match-test 'testFuzz|invariant|test_replay'
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Slither (no High, no Medium beyond the triaged baseline)
        run: |
          pip install slither-analyzer==0.11.6
          python3 ../scripts/check_slither.py

  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
